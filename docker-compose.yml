services:
  boeuf:
    container_name: boeuf
    # build: .
    image: ghcr.io/mtruel/boeuf:dev
    # To use pre-built image instead: image: ghcr.io/mtruel/boeuf:dev
    restart: unless-stopped
    ports:
      - "${EXPOSE_PORT:-3000}:80"
    env_file:
      - .env
    environment:
      - PORT=8080
      - SESSION_KEY=${APP_SECRET}
      - ENCRYPTION_KEY=${APP_SECRET}
      - RUNTIME_ENV=production
      - DATABASE_PATH=/app/data/boeuf.db
    volumes:
      - boeuf_data:/app/data

volumes:
  boeuf_data:
