services:
  boeuf:
    build: .
    # To use pre-built image instead: image: ghcr.io/mtruel/boeuf:dev
    restart: unless-stopped
    ports:
      - "${EXPOSE_PORT:-3000}:80"
    env_file:
      - .env
    environment:
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - APP_SECRET=${APP_SECRET}
      - EXPOSE_PORT=${EXPOSE_PORT:-3000}
      - PORT=8080
      - SESSION_KEY=${APP_SECRET}
      - ENCRYPTION_KEY=${APP_SECRET}
      - SESSION_DURATION_HOURS=${SESSION_DURATION_HOURS:-24}
      - MAX_ACTIVE_SESSIONS_PER_USER=${MAX_ACTIVE_SESSIONS_PER_USER:-10}
      - RUNTIME_ENV=production
      - DATABASE_PATH=/app/data/boeuf.db
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-http://localhost:3000/auth/spotify/callback}
    volumes:
      - boeuf_data:/app/data

volumes:
  boeuf_data:
