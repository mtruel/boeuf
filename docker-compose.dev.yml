services:
  # Override boeuf service for development - build instead of using image
  boeuf:
    build: .
    environment:
      - RUNTIME_ENV=development
    # For dev, we might want to expose backend directly
    ports:
      - "${EXPOSE_PORT:-3000}:80"
      - "8080:8080"  # Direct backend access for debugging

  # Separate backend service for hot reload during development
  backend-dev:
    build:
      context: ./backend
      target: build 
    command: go run ./cmd/boeuf-server
    volumes:
      - ./backend:/app
      - go_pkg_mod:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    environment:
      - PORT=8080
      - RUNTIME_ENV=development
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - APP_SECRET=${APP_SECRET:-0123456789abcdef0123456789abcdef}
      - SESSION_KEY=${APP_SECRET:-0123456789abcdef0123456789abcdef}
      - ENCRYPTION_KEY=${APP_SECRET:-0123456789abcdef0123456789abcdef}
      - DATABASE_PATH=./data/boeuf.db
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-http://localhost:3000/auth/spotify/callback}
    ports:
      - "8080:8080"
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app

  # Separate frontend service for hot reload during development
  frontend-dev:
    build:
      context: ./frontend
      target: dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install -g pnpm && if [ ! -d node_modules ]; then pnpm install; fi && pnpm exec vite --host"
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "5173:5173"
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
          ignore:
            - node_modules/
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: rebuild
          path: ./frontend/package.json

volumes:
  go_pkg_mod:
  go_build_cache:
